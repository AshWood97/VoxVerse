[package]
name = "voxverse"
version = "1.0.0"
description = "VoxVerse - Voice-first character universe for immersive roleplay and learning"
authors = ["you"]
edition = "2021"
default-run = "voxverse"

[lib]
name = "voxverse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "voxverse"
path = "src/main.rs"

[[bin]]
name = "voxverse-cli"
path = "src/bin/voxverse.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
keyring = "3.6.3"
msedge-tts = "0.3.0"
